<!doctype html>
<!--
  Track 2 tracer bullet — Slide 8, the narrative pivot, animated.

  One ranked list of provinces physically reorders from "most crashes" into
  "most deaths" as the presenter scrolls, so the audience watches the claim
  happen instead of comparing two pictures themselves.

  Tab 2 absorbs this page in ticket 11; it stands alone here so the chart can be
  driven and inspected without the rest of the site existing. All layout maths is
  in assets/js/layout.js and is checked by analysis/scripts/12_qa_chart_layout.js
  without a browser.

  Needs a local server, not file://, because it fetches its data — same as the
  map prototype. No network: nothing here is loaded from off the machine.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crash hot spots are not death hot spots</title>
<link rel="stylesheet" href="assets/css/charts.css">
<style>
  html, body { margin: 0; background: var(--surface); color: var(--ink);
               font-family: "Segoe UI", system-ui, -apple-system, sans-serif; }

  /* The section is three viewports tall and the chart is pinned inside it, so
     scroll distance becomes animation progress and the presenter sets the pace.
     Whichever treatment ticket 08 settles on replaces this block and nothing
     else — the chart only ever receives a scalar. */
  .scroll-section { height: 300vh; position: relative; }
  .pin { position: sticky; top: 0; height: 100vh; display: grid;
         place-items: center; padding: 0 clamp(16px, 4vw, 64px); }
  .frame { width: min(1280px, 100%); }

  .spacer { height: 40vh; display: grid; place-items: center; }
  .spacer p { max-width: 46ch; font-size: clamp(16px, 1.5vw, 20px);
              line-height: 1.6; color: var(--ink-2); text-align: center; }
  .cue { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
         font-size: 13px; color: var(--muted); letter-spacing: .04em; }
</style>
</head>
<body>

<div class="spacer">
  <p>Enforcement resources get allocated by crash count. Scroll to see what
     happens when the same provinces are ranked by deaths instead.</p>
</div>

<section class="scroll-section" id="section">
  <div class="pin"><div class="frame" id="mount"></div></div>
</section>

<div class="spacer">
  <p>Only 8 of the 12 provinces appear on both lists. Allocating by crash count
     sends people to the wrong four.</p>
</div>

<div class="cue" id="cue">scroll</div>

<script src="assets/js/layout.js"></script>
<script src="assets/js/render.js"></script>
<script>
fetch("assets/data/charts/slide08_provinces.json")
  .then(function (r) { return r.json(); })
  .then(function (data) {
    var chart = ChartRender.slide08(document.getElementById("mount"), data);
    var section = document.getElementById("section");
    var cue = document.getElementById("cue");

    function tick() {
      var r = section.getBoundingClientRect();
      var p = ChartLayout.progressFor(r.top, r.height, window.innerHeight);
      chart.update(p);
      cue.style.opacity = p > 0.02 && p < 0.98 ? 0 : 1;
    }

    addEventListener("scroll", tick, { passive: true });
    addEventListener("resize", tick);
    tick();

    // Lets the chart be driven directly — by a check, or by a presenter's
    // keyboard during Q&A once ticket 08 decides what that should be.
    window.__chart = chart;
  });
</script>
</body>
</html>
